server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Note: add_header in a location block replaces these, so locations below use `expires` instead.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Only the inline theme script in index.html is allowed, by hash (ADR-0017). Update the hash if that script changes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-+PtwcHQ97RAB/XuPJDQYWhT/LdWovXNxYmaRSuv6D4U='; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Phase 2: replace the return with `proxy_pass http://api:8000;` once the API service exists.
    location /api/ {
        default_type application/json;
        return 503 '{"error":"backend not enabled yet"}\n';
    }

    # Vite emits content-hashed filenames under /assets, so they are safe to cache for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # SPA fallback so deep links and refreshes work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
